services:
  api:
    build: .
    # Loads your local .env (OPENAI_API_KEY, OPENAI_MODEL, LLM_CONFIDENCE_THRESHOLD, ...).
    # Interpolated values below keep safe defaults while allowing .env overrides.
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      YAD2_TAXONOMY_PATH: /app/yad2_search_taxonomy.json
      YAD2_ENRICHMENT_PATH: /app/data/enrichment_aliases.json
      YAD2_LEARNED_SYNONYMS_PATH: /app/data/learned_synonyms.json
      ENABLE_LLM_FALLBACK: ${ENABLE_LLM_FALLBACK:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      LLM_CONFIDENCE_THRESHOLD: ${LLM_CONFIDENCE_THRESHOLD:-0.60}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-700}
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: yad2_taxonomy_candidates
      VECTOR_TOP_K: "12"
      # ML embedding engine. Default "hashed" is deterministic and needs no model
      # download. Set to "openai" + provide OPENAI_API_KEY for learned embeddings.
      EMBEDDING_BACKEND: hashed
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      # Set to "true" to include per-field match evidence in the response notes.
      INCLUDE_DEBUG_NOTES: "false"
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_BURST: "40"
      SUSPICIOUS_RATE_LIMIT_PER_MINUTE: "12"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
